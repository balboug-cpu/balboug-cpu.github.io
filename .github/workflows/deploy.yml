name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir site
          if [ -f dhameen-web.zip ]; then unzip -o dhameen-web.zip -d site; else cp README.md site/index.html; fi
          touch site/.nojekyll
          [ -f CNAME ] && cp CNAME site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4

